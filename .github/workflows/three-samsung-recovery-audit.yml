name: A37 A26 S24 First-party PDP Recovery Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teknoskor-three-samsung-recovery-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test exact source guards and audit
        run: python -m unittest -q test_mediamarkt_source test_pasaj_source test_retailer_offer_refresh test_reviewed_offer_targets test_three_samsung_recovery_audit
      - name: Start read-only browser GET service
        run: |
          docker run -d --name=three-samsung-audit-browser -p 8191:8191 -e LOG_LEVEL=info ghcr.io/flaresolverr/flaresolverr:latest
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8191/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs three-samsung-audit-browser
          exit 1
      - name: Probe exact PDPs through existing selected-offer readers
        env:
          THREE_SAMSUNG_AUDIT_OUTPUT_DIR: ${{ runner.temp }}
        run: python audit_three_samsung_recovery.py
      - name: Publish read-only summary
        if: always()
        run: |
          if test -f "${{ runner.temp }}/three-samsung-recovery.md"; then
            cat "${{ runner.temp }}/three-samsung-recovery.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-samsung-recovery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/three-samsung-recovery.json
            ${{ runner.temp }}/three-samsung-recovery.md
          if-no-files-found: warn
          retention-days: 14

name: S25 FE idefix Read-only PDP Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teknoskor-s25-fe-idefix-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check conditional-price and read-only audit contracts
        run: python -m unittest -q test_retailer_offer_refresh test_s25_fe_idefix_audit
      - name: Probe one exact idefix PDP without writes
        env:
          S25_FE_IDEFIX_AUDIT_OUTPUT_DIR: ${{ runner.temp }}
        run: python audit_s25_fe_idefix.py
      - name: Publish diagnostic summary
        if: always()
        run: |
          if test -f "${{ runner.temp }}/s25-fe-idefix-reader.md"; then
            cat "${{ runner.temp }}/s25-fe-idefix-reader.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s25-fe-idefix-reader-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/s25-fe-idefix-reader.json
            ${{ runner.temp }}/s25-fe-idefix-reader.md
          if-no-files-found: warn
          retention-days: 14

name: Priority Retailer Full Catalog Recovery
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Full refresh, recover missing prices/second sellers, or read-only source diagnostics'
        type: choice
        options:
          - full
          - coverage-first
          - memory-variants
          - memory-variant-preflight
          - n11-preflight
          - hepsiburada-category-audit
          - target-preflight
        default: full
        required: true
      publish:
        description: 'Reverify and publish proven existing-catalog offers during this one sweep'
        type: boolean
        required: true
        default: false
      resolve_radio:
        description: 'Resolve only absent catalog radio from exact public manufacturer model/code/memory before the memory sweep'
        type: boolean
        required: true
        default: false
      target_slug:
        description: 'Read-only target-preflight only: existing published product slug'
        type: string
        required: false
        default: ''
      target_url:
        description: 'Read-only target-preflight only: one public priority-retailer PDP URL'
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  # Read-only sweeps spend the same retailer quota as publishers. Serialize
  # them too, so a diagnostic cannot double traffic on a recovering source.
  group: teknoskor-daily-data-sync
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test full queue and live publication boundaries
        run: python -m unittest -q test_offer_ingestion_client test_hepsiburada_catalog_discovery test_hepsiburada_category_frontier test_trendyol_catalog_discovery test_teknosa_catalog_discovery test_teknosa_seller_cards test_automatic_marketplace_refresh test_selected_sku_evidence test_priority_catalog_budget test_priority_catalog_sweep test_priority_candidates test_priority_retailers test_hepsiburada_catalog_source test_trendyol_catalog_source test_trendyol_basket_price test_teknosa_catalog_source test_teknosa_public_technical test_teknosa_marketplace_source test_n11_catalog_source test_raw_seller_collision_proof test_observed_memory_variants test_automatic_memory_variants test_incremental_memory_recovery test_manufacturer_catalog_radio
      - name: Restore observed category URL frontier
        if: inputs.mode == 'full' || inputs.mode == 'coverage-first' || inputs.mode == 'memory-variants'
        id: category-frontier
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .discovery-state/priority-hb-category.json
          key: priority-hb-frontier-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: priority-hb-frontier-v1-${{ github.ref_name }}-
      - name: Start existing public document GET service
        run: |
          docker run -d --name=priority-sweep-browser -p 8191:8191 -e LOG_LEVEL=info ghcr.io/flaresolverr/flaresolverr:latest
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8191/ > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Inspect the entire priority catalog queue and optionally publish fresh proven offers
        id: inspect
        env:
          TEKNOSKOR_INGESTION_URL: ${{ vars.TEKNOSKOR_INGESTION_URL || 'https://teknoskor.com' }}
          SCRAPER_INGESTION_SECRET: ${{ secrets.SCRAPER_INGESTION_SECRET }}
          PUBLISH: ${{ inputs.publish }}
          MODE: ${{ inputs.mode }}
          RESOLVE_RADIO: ${{ inputs.resolve_radio }}
          TARGET_SLUG: ${{ inputs.target_slug }}
          TARGET_URL: ${{ inputs.target_url }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
        run: |
          set --
          if test "$RESOLVE_RADIO" = true; then
            if test "$MODE" != memory-variants; then
              echo 'Manufacturer radio resolution requires memory-variants mode'
              exit 1
            fi
            set -- --manufacturer-radio
          fi
          if test "$MODE" = memory-variant-preflight; then
            python -u sweep_priority_catalog.py --memory-variant-preflight
          elif test "$MODE" = target-preflight; then
            python -u sweep_priority_catalog.py --target-preflight "$TARGET_URL" --target-slug "$TARGET_SLUG"
          elif test "$MODE" = n11-preflight; then
            python -u sweep_priority_catalog.py --n11-preflight
          elif test "$MODE" = hepsiburada-category-audit; then
            python -u sweep_priority_catalog.py --hepsiburada-category-audit
          elif test "$MODE" = memory-variants; then
            # Retain only models already covered by a fresh whole-catalog
            # server audit. Spend this recovery run on price/seller gaps and
            # independently observed other capacities, not another refresh of
            # every currently verified color/seller resource.
            if test "$PUBLISH" = true; then
              python -u sweep_priority_catalog.py --memory-variants --coverage-first --publish "$@"
            else
              python -u sweep_priority_catalog.py --memory-variants --coverage-first "$@"
            fi
          elif test "$MODE" = coverage-first; then
            if test "$PUBLISH" = true; then
              python -u sweep_priority_catalog.py --coverage-first --publish
            else
              python -u sweep_priority_catalog.py --coverage-first
            fi
          elif test "$PUBLISH" = true; then
            python -u sweep_priority_catalog.py --publish
          else
            python -u sweep_priority_catalog.py
          fi
      - name: Preserve observed category URLs after the coverage gate
        if: always() && (inputs.mode == 'full' || inputs.mode == 'coverage-first' || inputs.mode == 'memory-variants') && steps.inspect.outcome != 'skipped' && hashFiles('.discovery-state/priority-hb-category.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .discovery-state/priority-hb-category.json
          key: priority-hb-frontier-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Summarize queue coverage and remaining reasons
        if: always()
        run: |
          if test -f priority-catalog-sweep.md; then cat priority-catalog-sweep.md >> "$GITHUB_STEP_SUMMARY"; fi
          docker logs priority-sweep-browser 2>&1 | tail -200
          docker logs priority-sweep-browser > priority-source-service.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: priority-catalog-sweep-${{ github.run_id }}
          path: |
            priority-catalog-sweep.*
            automatic-memory-variants.json
            catalog-radio-resolution.json
            priority-source-service.log
          retention-days: 30

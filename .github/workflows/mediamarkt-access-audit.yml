name: MediaMarkt Public PDP Access Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Start read-only browser GET service
        run: |
          docker run -d --name=mediamarkt-audit-browser -p 8191:8191 -e LOG_LEVEL=info ghcr.io/flaresolverr/flaresolverr:latest
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8191/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs mediamarkt-audit-browser
          exit 1
      - name: Probe fixed sitemaps and three public PDPs
        env:
          MEDIAMARKT_AUDIT_OUTPUT_DIR: ${{ runner.temp }}
          MEDIAMARKT_AUDIT_BROWSER_GET: '1'
        run: python audit_mediamarkt_access.py
      - name: Publish read-only summary
        if: always()
        run: |
          if test -f "${{ runner.temp }}/mediamarkt-access.md"; then
            cat "${{ runner.temp }}/mediamarkt-access.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediamarkt-access-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mediamarkt-access.json
            ${{ runner.temp }}/mediamarkt-access.md
          if-no-files-found: warn
          retention-days: 30

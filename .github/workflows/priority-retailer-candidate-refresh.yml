name: Priority Retailer Automatic Candidate Refresh
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Re-read and atomically publish only this run automatic verified candidates'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ inputs.publish && 'teknoskor-daily-data-sync' || 'teknoskor-priority-candidate-preflight' }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test catalog source proofs and one atomic writer
        run: python -m unittest -q test_priority_candidates test_priority_retailers test_hepsiburada_catalog_source test_trendyol_catalog_source test_teknosa_catalog_source test_raw_seller_collision_proof
      - name: Start bounded existing public GET service
        run: |
          docker run -d --name=priority-candidate-browser -p 8191:8191 -e LOG_LEVEL=info ghcr.io/flaresolverr/flaresolverr:latest
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8191/ > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Automatically discover candidates from existing catalog hints without writes
        env:
          TEKNOSKOR_INGESTION_URL: ${{ vars.TEKNOSKOR_INGESTION_URL || 'https://teknoskor.com' }}
          SCRAPER_INGESTION_SECRET: ${{ secrets.SCRAPER_INGESTION_SECRET }}
        run: python audit_priority_retailers.py
      - name: Reverify candidates, complete seller targets and publish one atomic batch
        if: ${{ inputs.publish }}
        env:
          TEKNOSKOR_INGESTION_URL: ${{ vars.TEKNOSKOR_INGESTION_URL || 'https://teknoskor.com' }}
          SCRAPER_INGESTION_SECRET: ${{ secrets.SCRAPER_INGESTION_SECRET }}
        run: python publish_priority_candidates.py
      - name: Summarize read-only proof and optional one-time refresh
        if: always()
        run: |
          for report in priority-retailer-audit.md priority-candidate-refresh.md; do
            if test -f "$report"; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: priority-candidate-refresh-${{ github.run_id }}
          path: |
            priority-retailer-audit.*
            priority-candidate-refresh.*
          retention-days: 30

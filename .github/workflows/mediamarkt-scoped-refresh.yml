name: MediaMarkt Reviewed SKU Price Refresh

on:
  workflow_dispatch:

permissions:
  contents: read

# A scoped price writer must wait for the daily full-catalog writer. The
# server's product-row locks also serialize reconciliation with offer writes.
concurrency:
  group: teknoskor-daily-data-sync
  queue: max
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run source and offer validation tests
        run: python -m unittest -q test_mediamarkt_source test_retailer_offer_refresh test_reviewed_offer_targets test_price_refresh_orchestration
      - name: Start bounded browser GET service
        run: |
          docker run -d --name=mediamarkt-scoped-browser -p 8191:8191 -e LOG_LEVEL=info ghcr.io/flaresolverr/flaresolverr:latest
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8191/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs mediamarkt-scoped-browser
          exit 1
      - name: Refresh reviewed exact SKU destinations
        id: scoped_prices
        env:
          TEKNOSKOR_INGESTION_URL: ${{ vars.TEKNOSKOR_INGESTION_URL || 'https://teknoskor.com' }}
          SCRAPER_INGESTION_SECRET: ${{ secrets.SCRAPER_INGESTION_SECRET }}
        run: |
          set -euo pipefail
          : "${SCRAPER_INGESTION_SECRET:?SCRAPER_INGESTION_SECRET is required}"
          slugs="$(python -c 'import json; from pathlib import Path; print(",".join(row["slug"] for row in json.loads(Path("offer_batches/mediamarkt-exact-2026-11-02.json").read_text())["products"]))')"
          python update_prices.py --slugs "$slugs" --known-pdp-only --report mediamarkt-scoped-report.json
      - name: Reconcile scores after committed offers
        if: ${{ always() && !cancelled() && (steps.scoped_prices.outcome == 'success' || steps.scoped_prices.outcome == 'failure') }}
        env:
          TEKNOSKOR_INGESTION_URL: ${{ vars.TEKNOSKOR_INGESTION_URL || 'https://teknoskor.com' }}
          SCRAPER_INGESTION_SECRET: ${{ secrets.SCRAPER_INGESTION_SECRET }}
        run: python reconcile_scores.py
      - name: Summarize reviewed coverage
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('mediamarkt-scoped-report.json')
          if path.is_file():
              report = json.loads(path.read_text())
              coverage = report.get('coverage', {})
              lines = ['## MediaMarkt reviewed SKU refresh',
                       f"Status: {report.get('status')}; verified offer on {coverage.get('with_purchasable_offer', 0)}/{coverage.get('products', 0)} models; two merchants on {coverage.get('with_two_merchants', 0)}."]
              for product in report.get('products', []):
                  media = [row for row in product.get('source_attempts', []) if row.get('merchant') == 'MediaMarkt']
                  lines.append(f"- {product['slug']}: " + ', '.join(f"{row.get('reason')} HTTP {row.get('http_status')}" for row in media))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write('\n'.join(lines) + '\n')
          PY
      - name: Upload offer and score evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediamarkt-scoped-${{ github.run_id }}
          path: |
            mediamarkt-scoped-report.json
            score-reconciliation.json
          if-no-files-found: warn
          retention-days: 30

name: Apple Store Strict Offer Reader Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test strict Apple selected-offer contract
        run: python -m unittest -q test_apple_store_source
      - name: Start bounded read-only browser GET service
        run: |
          docker run -d --name=apple-store-reader-browser -p 8191:8191 -e LOG_LEVEL=info ghcr.io/flaresolverr/flaresolverr:latest
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8191/ > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs apple-store-reader-browser
          exit 1
      - name: Prove four selected catalog variants without writes
        env:
          APPLE_STORE_READER_AUDIT_OUTPUT_DIR: ${{ runner.temp }}
        run: python audit_apple_store_reader.py
      - name: Publish read-only summary
        if: always()
        run: |
          if test -f "${{ runner.temp }}/apple-store-reader.md"; then
            cat "${{ runner.temp }}/apple-store-reader.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-store-reader-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/apple-store-reader.json
            ${{ runner.temp }}/apple-store-reader.md
          if-no-files-found: warn
          retention-days: 30

name: Xiaomi 17T First-party Exact PDP Read-only Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test selected first-party reader and exact variant audit
        run: python -m unittest -q test_mediamarkt_source test_retailer_offer_refresh test_xiaomi_17t_first_party_audit
      - name: Start read-only browser GET service
        run: |
          docker run -d --name=xiaomi-17t-audit-browser -p 8191:8191 -e LOG_LEVEL=info ghcr.io/flaresolverr/flaresolverr:latest
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8191/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs xiaomi-17t-audit-browser
          exit 1
      - name: Check two selected Xiaomi SKUs without writes
        env:
          XIAOMI_17T_AUDIT_OUTPUT_DIR: ${{ runner.temp }}
        run: python audit_xiaomi_17t_first_party.py
      - name: Publish read-only summary
        if: always()
        run: |
          if test -f "${{ runner.temp }}/xiaomi-17t-first-party.md"; then
            cat "${{ runner.temp }}/xiaomi-17t-first-party.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-17t-first-party-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/xiaomi-17t-first-party.json
            ${{ runner.temp }}/xiaomi-17t-first-party.md
          if-no-files-found: warn
          retention-days: 14

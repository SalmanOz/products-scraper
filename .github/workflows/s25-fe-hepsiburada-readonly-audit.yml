name: Samsung S25 FE 8 256 Hepsiburada Read-only PDP Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teknoskor-s25-fe-hepsiburada-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test selected buy box and request bounds
        run: python -m unittest -q test_s25_fe_hepsiburada_audit
      - name: Start bounded read-only browser GET service
        run: |
          docker run -d --name=s25-fe-hepsiburada-browser -p 8191:8191 -e LOG_LEVEL=info ghcr.io/flaresolverr/flaresolverr:latest
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8191/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs s25-fe-hepsiburada-browser
          exit 1
      - name: Probe one exact public PDP without writes
        env:
          S25_FE_HEPSIBURADA_AUDIT_OUTPUT_DIR: ${{ runner.temp }}
        run: python audit_s25_fe_hepsiburada.py
      - name: Publish read-only result
        if: always()
        run: |
          if test -f "${{ runner.temp }}/s25-fe-hepsiburada-audit.md"; then
            cat "${{ runner.temp }}/s25-fe-hepsiburada-audit.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s25-fe-hepsiburada-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/s25-fe-hepsiburada-audit.json
            ${{ runner.temp }}/s25-fe-hepsiburada-audit.md
          if-no-files-found: warn
          retention-days: 14

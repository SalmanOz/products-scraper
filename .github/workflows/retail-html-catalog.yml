name: Retail HTML catalog

on:
  schedule:
    - cron: '36 0,6,12,18 * * *'
    - cron: '21 1-23/2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check and save results without publishing to the site
        type: boolean
        default: false
      verification_run:
        description: Use the saved queue to check a small batch through the normal publisher
        type: boolean
        default: false

      watch_only:
        description: Recheck the three waiting barcodes and publish only their products
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: site-catalog-price-refresh
  queue: max
  cancel-in-progress: false

jobs:
  crawl:
    if: github.repository == 'SalmanOz/products-scraper' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    environment: site-catalog
    env:
      WATCH_ONLY: ${{ inputs.watch_only == true || github.event.schedule == '21 1-23/2 * * *' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ./.github/actions/site-catalog
        with:
          key: ${{ secrets.SITE_CATALOG_READ_KEY }}
          expansion: |
            /frontend/public/retail-catalog.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and test the scraper
        run: |
          python -m pip install -r requirements.txt
          python -m unittest -q test_retail_html_catalog test_retail_html_watch
      - name: Restore and advance the private HTML queue
        env:
          SITE_CATALOG_DEPLOY_KEY: ${{ secrets.SITE_CATALOG_READ_KEY }}
          CATALOG_SOURCE_ACTIONS_OIDC: 'true'
          VERIFICATION_RUN: ${{ inputs.verification_run == true }}
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/html-catalog"
          mkdir -p "$path"
          if bash .github/scripts/site-git ls-remote --exit-code origin refs/heads/scraper-retail-html >/dev/null; then
            bash .github/scripts/site-git fetch --depth=1 origin refs/heads/scraper-retail-html
            bash .github/scripts/site-git show FETCH_HEAD:queue.sqlite.gz | gzip -dc > "$path/queue.sqlite"
            bash .github/scripts/site-git show FETCH_HEAD:images.sqlite.gz | gzip -dc > "$path/images.sqlite"
          else
            test "$?" -eq 2
          fi
          if [[ "$WATCH_ONLY" == true ]]; then
            rm -f "$path/staged.json"
          elif [[ "$VERIFICATION_RUN" == true ]]; then
            python retail_html_catalog.py --db "$path/queue.sqlite" --verify-only --maximum 12
            python retail_html_catalog.py --db "$path/queue.sqlite" --refresh --maximum 12 --output "$path/staged.json"
          else
            python retail_html_catalog.py --db "$path/queue.sqlite" --pages 38 --maximum 900
            python retail_html_catalog.py --db "$path/queue.sqlite" --refresh --maximum 900 --output "$path/staged.json"
          fi
          python retail_html_watch.py --db "$path/queue.sqlite" --output "$path/staged.json"
      - name: Validate and publish the private catalog
        env:
          SITE_CATALOG_DEPLOY_KEY: ${{ secrets.SITE_CATALOG_WRITE_KEY }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: bash .github/scripts/publish-html-catalog
      - name: Verify watched products on the live site
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          catalog="$RUNNER_TEMP/html-catalog/merged.json"
          if python verify_retail_html_watch_live.py "$catalog" --has-products; then
            python -m playwright install --with-deps chromium
          fi
          python verify_retail_html_watch_live.py "$catalog"

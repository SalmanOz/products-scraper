name: Retail HTML catalog

on:
  schedule:
    - cron: '36 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check and save results without publishing to the site
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: retail-html-catalog
  cancel-in-progress: false

jobs:
  crawl:
    if: github.repository == 'SalmanOz/products-scraper' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    environment: site-catalog
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: ./.github/actions/site-catalog
        with:
          key: ${{ secrets.SITE_CATALOG_READ_KEY }}
          expansion: |
            /frontend/public/retail-catalog.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install and test the scraper
        run: |
          python -m pip install -r requirements.txt
          python -m unittest -q test_retail_html_catalog
      - name: Restore and advance the private HTML queue
        env:
          SITE_CATALOG_DEPLOY_KEY: ${{ secrets.SITE_CATALOG_READ_KEY }}
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/html-catalog"
          mkdir -p "$path"
          if bash .github/scripts/site-git ls-remote --exit-code origin refs/heads/scraper-retail-html >/dev/null; then
            bash .github/scripts/site-git fetch --depth=1 origin refs/heads/scraper-retail-html
            bash .github/scripts/site-git show FETCH_HEAD:queue.sqlite.gz | gzip -dc > "$path/queue.sqlite"
            bash .github/scripts/site-git show FETCH_HEAD:images.sqlite.gz | gzip -dc > "$path/images.sqlite"
          else
            test "$?" -eq 2
          fi
          python retail_html_catalog.py --db "$path/queue.sqlite" --pages 38 --maximum 900
          python retail_html_catalog.py --db "$path/queue.sqlite" --refresh --maximum 500 --output "$path/staged.json"
      - name: Validate and publish the private catalog
        env:
          SITE_CATALOG_DEPLOY_KEY: ${{ secrets.SITE_CATALOG_WRITE_KEY }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: bash .github/scripts/publish-html-catalog

name: Automatic Retailer Pipeline Audit
on:
  workflow_dispatch:
    inputs:
      retailer:
        description: 'Retailer discovery hints to inspect without any writes'
        type: choice
        options: [all, vatan]
        default: all
      priced_only:
        description: 'Inspect additional sellers for models with a current price'
        type: boolean
        default: false
      offset:
        description: 'Zero-based offset in the automatic candidate queue (12 per run)'
        type: number
        default: 0
permissions:
  contents: read
concurrency:
  group: teknoskor-automatic-retailer-readonly-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -q test_automatic_marketplace_refresh test_reviewed_offer_targets test_retailer_offer_refresh test_price_refresh_orchestration test_mediamarkt_source test_mediamarkt_marketplace_audit
      - run: python -m unittest -q test_pasaj_source test_pasaj_unreviewed_candidates
      - run: python -m unittest -q test_vatan_jsonld_reviews test_vatan_category_unpriced
      - name: Start existing browser GET transport
        run: |
          docker run -d --name=retailer-audit-browser -p 8191:8191 -e LOG_LEVEL=info ghcr.io/flaresolverr/flaresolverr:latest
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8191/ > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Automatically discover catalog candidates and verify PDPs without writing
        env:
          TEKNOSKOR_INGESTION_URL: ${{ vars.TEKNOSKOR_INGESTION_URL || 'https://teknoskor.com' }}
          SCRAPER_INGESTION_SECRET: ${{ secrets.SCRAPER_INGESTION_SECRET }}
          AUDIT_RETAILER: ${{ inputs.retailer }}
          AUDIT_PRICED_ONLY: ${{ inputs.priced_only }}
          AUDIT_OFFSET: ${{ inputs.offset }}
        run: |
          args=(--retailer "$AUDIT_RETAILER" --offset "$AUDIT_OFFSET")
          if [[ "$AUDIT_PRICED_ONLY" == 'true' ]]; then args+=(--priced-only); fi
          python audit_automatic_marketplace.py "${args[@]}"
      - if: always()
        run: |
          if test -f automatic-marketplace-audit.md; then cat automatic-marketplace-audit.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automatic-retailer-audit-${{ github.run_id }}
          path: automatic-marketplace-audit.*
          retention-days: 14

name: Recover phone prices from comparison leads

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      collection:
        description: Network for the public retailer document reads
        type: choice
        options: [site, runner, macos]
        default: site
      publish:
        description: Publish both independently verified prices for each iPhone 16 Plus capacity
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: teknoskor-daily-data-sync
  queue: max
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.collection == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -q test_competitor_catalog_gaps test_comparison_phone_offers
      - name: Discover original retailer links
        run: |
          curl -fsS --max-time 25 https://teknoskor.com/sitemap.xml -o "$RUNNER_TEMP/phone-sitemap.xml"
          python competitor_catalog_gaps.py --phone-sitemap "$RUNNER_TEMP/phone-sitemap.xml" \
            --category phone --source urunai.com --source karsilastirici.com --source pahalimi.com \
            --pages 1 --lead-limit 5 --prioritize-model apple-iphone-16-plus \
            --state "$RUNNER_TEMP/comparison-state.json" --output "$RUNNER_TEMP/comparison-leads.json"
      - name: Verify same-barcode offers from independent retailers
        env:
          TEKNOSKOR_INGESTION_URL: ${{ vars.TEKNOSKOR_INGESTION_URL || 'https://teknoskor.com' }}
          SCRAPER_INGESTION_SECRET: ${{ secrets.SCRAPER_INGESTION_SECRET }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
          COLLECTION: ${{ github.event_name == 'schedule' && 'runner' || inputs.collection }}
        run: |
          set -euo pipefail
          if [[ "$COLLECTION" == site ]]; then
            audience='https%3A%2F%2Fteknoskor.com%2Fapi%2Fingestion%2Fcatalog-source-document'
            CATALOG_SOURCE_OIDC=$(curl -fsS --max-time 20 \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$audience" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')
            test -n "$CATALOG_SOURCE_OIDC"
            echo "::add-mask::$CATALOG_SOURCE_OIDC"
            export CATALOG_SOURCE_OIDC
          fi
          args=()
          if [[ "$PUBLISH" == true ]]; then args+=(--publish); fi
          python comparison_phone_offers.py --state "$RUNNER_TEMP/comparison-state.json" \
            --slug apple-iphone-16-plus --slug apple-iphone-16-plus-8gb-256gb \
            "${args[@]}" | tee "$RUNNER_TEMP/comparison-recovery.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-phone-recovery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/comparison-leads.json
            ${{ runner.temp }}/comparison-recovery.json
          retention-days: 15

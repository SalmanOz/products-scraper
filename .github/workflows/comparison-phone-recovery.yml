name: Recover phone prices from comparison leads

on:
  workflow_run:
    # Reuse the daily phone discovery trigger. The previous standalone
    # schedule had no recorded executions.
    workflows: ['Daily Phone Discovery & Quality Gate']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Reviewed phone group for this run
        type: choice
        options: [iphone-16-plus, galaxy-foldables, vivo-x300-pro, reviewed-candidates]
        default: iphone-16-plus
      reviewed_pairs:
        description: Reviewed candidates as JSON containing only slug, gtin, and retailer URLs
        type: string
        required: false
      collection:
        description: Network for the public retailer document reads
        type: choice
        options: [site, runner, macos, mixed]
        default: site
      publish:
        description: Publish both independently verified prices for each selected capacity
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: teknoskor-daily-data-sync
  queue: max
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'schedule' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.run_attempt == 1))
    runs-on: ${{ (inputs.collection == 'macos' || inputs.collection == 'mixed') && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -q test_competitor_catalog_gaps test_comparison_phone_offers test_metto_phone_source
      - name: Verify same-barcode offers from independent retailers
        env:
          TEKNOSKOR_INGESTION_URL: ${{ vars.TEKNOSKOR_INGESTION_URL || 'https://teknoskor.com' }}
          SCRAPER_INGESTION_SECRET: ${{ secrets.SCRAPER_INGESTION_SECRET }}
          PUBLISH: ${{ github.event_name == 'workflow_run' || inputs.publish }}
          COMPARISON_PHONE_COLLECTION: ${{ github.event_name == 'workflow_run' && 'site' || inputs.collection }}
          TARGET: ${{ github.event_name == 'workflow_run' && 'iphone-16-plus' || inputs.target }}
          REVIEWED_PAIRS: ${{ inputs.reviewed_pairs }}
        run: |
          set -euo pipefail
          if [[ "$COMPARISON_PHONE_COLLECTION" == site || "$COMPARISON_PHONE_COLLECTION" == mixed ]]; then
            audience='https%3A%2F%2Fteknoskor.com%2Fapi%2Fingestion%2Fcatalog-source-document'
            CATALOG_SOURCE_OIDC=$(curl -fsS --max-time 20 \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$audience" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')
            test -n "$CATALOG_SOURCE_OIDC"
            echo "::add-mask::$CATALOG_SOURCE_OIDC"
            export CATALOG_SOURCE_OIDC
          fi
          args=()
          if [[ "$PUBLISH" == true ]]; then args+=(--publish); fi
          case "$TARGET" in
            iphone-16-plus) args+=(--iphone-16-plus) ;;
            galaxy-foldables|vivo-x300-pro)
              args+=(--reviewed-pairs "offer_batches/comparison-${TARGET}.json") ;;
            reviewed-candidates)
              test "${#REVIEWED_PAIRS}" -gt 0 && test "${#REVIEWED_PAIRS}" -le 12000
              printf '%s' "$REVIEWED_PAIRS" > "$RUNNER_TEMP/reviewed-pairs.json"
              args+=(--reviewed-pairs "$RUNNER_TEMP/reviewed-pairs.json") ;;
            *) exit 2 ;;
          esac
          python comparison_phone_offers.py "${args[@]}" | tee "$RUNNER_TEMP/comparison-recovery.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-phone-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/comparison-recovery.json
          retention-days: 15

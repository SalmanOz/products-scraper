name: PC parts price refresh

on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Collect and verify prices without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: site-catalog-price-refresh
  queue: max
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'SalmanOz/products-scraper' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: site-catalog
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/site-catalog
        with:
          key: ${{ secrets.SITE_CATALOG_READ_KEY }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install scraper dependencies
        run: python -m pip install -r requirements.txt
      - name: Revalidate published component GTINs
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/site-price-refresh"
          mkdir -p "$out"
          source=site/frontend/src/data/pcParts.json
          sha256sum "$source" | cut -d ' ' -f 1 > "$out/source.sha256"
          python pc_parts_multistore.py --refresh "$source" --output "$out/snapshot.json"
          node site/frontend/scripts/verify-pc-parts.mjs "$out/snapshot.json" --refresh > "$out/validation.log" 2>&1 \
            || { echo 'PC component snapshot did not pass validation.' >&2; exit 1; }
      - name: Publish the verified price snapshot
        id: publish
        if: inputs.dry_run != true
        env:
          SITE_CATALOG_DEPLOY_KEY: ${{ secrets.SITE_CATALOG_WRITE_KEY }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/site-price-refresh"
          bash .github/scripts/publish-site-prices pc-parts "$out/snapshot.json" \
            "$(cat "$out/source.sha256")"
      - name: Verify the website is serving the published commit
        if: steps.publish.outputs.sha != ''
        env:
          EXPECTED_SHA: ${{ steps.publish.outputs.sha }}
        run: bash .github/scripts/wait-for-site "$EXPECTED_SHA" pc-parts

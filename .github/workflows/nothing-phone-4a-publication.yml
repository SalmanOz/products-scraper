name: Nothing Phone 4a catalog publication

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only Nothing Phone 4a white 8/256 after live same-barcode verification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.publish && 'teknoskor-daily-data-sync' || 'teknoskor-nothing-phone-4a-validation' }}
  queue: max
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -q test_comparison_phone_offers test_evofone_offer_source test_daily_discovery
      - name: Validate and optionally publish two independent current offers
        env:
          TEKNOSKOR_INGESTION_URL: ${{ vars.TEKNOSKOR_INGESTION_URL || 'https://teknoskor.com' }}
          SCRAPER_INGESTION_SECRET: ${{ secrets.SCRAPER_INGESTION_SECRET }}
          R2_ACCESS_KEY_ID: ${{ inputs.publish && secrets.R2_ACCESS_KEY_ID || '' }}
          R2_SECRET_ACCESS_KEY: ${{ inputs.publish && secrets.R2_SECRET_ACCESS_KEY || '' }}
          R2_ACCOUNT_ID: ${{ inputs.publish && secrets.R2_ACCOUNT_ID || '' }}
          R2_BUCKET_NAME: ${{ inputs.publish && secrets.R2_BUCKET_NAME || '' }}
          R2_PUBLIC_DOMAIN: ${{ inputs.publish && secrets.R2_PUBLIC_DOMAIN || '' }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          mode=--validate
          if [[ "$PUBLISH" == true ]]; then mode=--publish; fi
          python publish_nothing_phone_4a.py "$mode" | tee "$RUNNER_TEMP/nothing-phone-4a.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nothing-phone-4a-${{ github.run_id }}
          path: ${{ runner.temp }}/nothing-phone-4a.jsonl
          retention-days: 15

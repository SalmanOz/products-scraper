name: Reviewed phone catalog publication

on:
  workflow_dispatch:
    inputs:
      model:
        description: Reviewed phone model
        type: choice
        options: ['4a', '3a', 'poco-c81-pro', 'oppo-a6-pro-5g']
        default: '4a'
      publish:
        description: Publish only the selected model after live same-barcode verification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ inputs.publish && 'teknoskor-daily-data-sync' || 'teknoskor-nothing-phone-4a-validation' }}
  queue: max
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -q test_comparison_phone_offers test_evofone_offer_source test_daily_discovery test_teknosa_catalog_source
      - name: Validate and optionally publish two independent current offers
        id: publication
        env:
          TEKNOSKOR_INGESTION_URL: ${{ vars.TEKNOSKOR_INGESTION_URL || 'https://teknoskor.com' }}
          SCRAPER_INGESTION_SECRET: ${{ secrets.SCRAPER_INGESTION_SECRET }}
          R2_ACCESS_KEY_ID: ${{ inputs.publish && secrets.R2_ACCESS_KEY_ID || '' }}
          R2_SECRET_ACCESS_KEY: ${{ inputs.publish && secrets.R2_SECRET_ACCESS_KEY || '' }}
          R2_ACCOUNT_ID: ${{ inputs.publish && secrets.R2_ACCOUNT_ID || '' }}
          R2_BUCKET_NAME: ${{ inputs.publish && secrets.R2_BUCKET_NAME || '' }}
          R2_PUBLIC_DOMAIN: ${{ inputs.publish && secrets.R2_PUBLIC_DOMAIN || '' }}
          PUBLISH: ${{ inputs.publish }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          mode=--validate
          if [[ "$PUBLISH" == true ]]; then mode=--publish; fi
          case "$MODEL" in
            poco-c81-pro) report=$MODEL; command=(python publish_poco_c81_pro_queue.py) ;;
            oppo-a6-pro-5g) report=$MODEL; command=(python publish_oppo_a6_pro_queue.py) ;;
            4a|3a) report="nothing-phone-$MODEL"; command=(python publish_nothing_phones.py --model "$MODEL") ;;
            *) exit 2 ;;
          esac
          echo "report=$report" >> "$GITHUB_OUTPUT"
          "${command[@]}" "$mode" | tee "$RUNNER_TEMP/$report.jsonl"
      - uses: actions/upload-artifact@v4
        if: always() && steps.publication.outputs.report != ''
        with:
          name: ${{ steps.publication.outputs.report }}-${{ github.run_id }}
          path: ${{ runner.temp }}/${{ steps.publication.outputs.report }}.jsonl
          retention-days: 15

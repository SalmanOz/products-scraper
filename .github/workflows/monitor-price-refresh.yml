name: Monitor price refresh

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the current monitor targets without publishing
        type: boolean
        default: false
      collection:
        description: Network used for the MediaMarkt product documents
        type: choice
        options: [site, mixed]
        default: site
      audit_sources:
        description: Report storefront response status without publishing prices
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: site-catalog-price-refresh
  queue: max
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'SalmanOz/products-scraper' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: site-catalog
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      COLLECTOR_AUDIENCE: https://teknoskor.com/api/ingestion/monitor-document
      COLLECTOR_PROBE_URL: https://teknoskor.com/api/ingestion/monitor-document
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/site-catalog
        with:
          key: ${{ secrets.SITE_CATALOG_READ_KEY }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify the production collector accepts this workflow
        run: |
          set -euo pipefail
          token=$(bash .github/scripts/collector-token "$COLLECTOR_AUDIENCE")
          code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            --data '{}' "$COLLECTOR_PROBE_URL")
          test "$code" = 403
      - name: Install scraper dependencies
        run: python -m pip install -r requirements.txt
      - name: Test monitor readers and refresh validation
        run: python -m unittest -q test_monitor_pilot test_monitor_refresh
      - name: Audit the approved storefront routes
        if: inputs.audit_sources == true
        run: |
          set -euo pipefail
          MONITOR_READER_OIDC=$(bash .github/scripts/collector-token "$COLLECTOR_AUDIENCE")
          export MONITOR_READER_OIDC
          python .github/scripts/audit-monitor-collector.py
      - name: Verify and collect prices for the published monitor GTINs
        if: inputs.audit_sources != true
        env:
          MONITOR_COLLECTION: ${{ inputs.collection || 'site' }}
          MONITOR_READER_ACTIONS_OIDC: 'true'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/site-price-refresh"
          mkdir -p "$out"
          source=site/frontend/src/data/monitorPilot.json
          sha256sum "$source" | cut -d ' ' -f 1 > "$out/source.sha256"
          if python monitor_refresh.py monitor_pilot_targets.json "$source" "$out/snapshot.json" \
            --collection "$MONITOR_COLLECTION" --report "$out/report.json" > "$out/collector.log" 2>&1; then
            result=0
          else
            result=$?
          fi
          if [ -s "$out/report.json" ]; then
            jq '{fresh_models, fresh_pairs, rejected}' "$out/report.json"
          elif [[ "$result" != 0 ]]; then
            grep -E '^  File ".*", line [0-9]+, in |^[A-Za-z.]+Error: (GitHub Actions|Expected 1)' "$out/collector.log" | tail -12 || true
          fi
          test "$result" -eq 0
          node site/frontend/scripts/verify-monitor-pilot.mjs --offers-only "$out/snapshot.json" \
            > "$out/validation.log" 2>&1 || { echo 'Monitor snapshot did not pass validation.' >&2; exit 1; }
      - name: Publish the verified price snapshot
        id: publish
        if: inputs.audit_sources != true && inputs.dry_run != true
        env:
          SITE_CATALOG_DEPLOY_KEY: ${{ secrets.SITE_CATALOG_WRITE_KEY }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/site-price-refresh"
          bash .github/scripts/publish-site-prices monitor "$out/snapshot.json" \
            "$(cat "$out/source.sha256")"
      - name: Verify the website is serving the published commit
        if: steps.publish.outputs.sha != ''
        env:
          EXPECTED_SHA: ${{ steps.publish.outputs.sha }}
        run: bash .github/scripts/wait-for-site "$EXPECTED_SHA" monitor

name: MediaMarkt Selected Offer Reader Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test strict reader and sitemap contracts
        run: python -m unittest -q test_mediamarkt_source test_reviewed_offer_targets test_retailer_offer_refresh test_price_refresh_orchestration
      - name: Start read-only browser GET service
        run: |
          docker run -d --name=mediamarkt-reader-browser -p 8191:8191 -e LOG_LEVEL=info ghcr.io/flaresolverr/flaresolverr:latest
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8191/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs mediamarkt-reader-browser
          exit 1
      - name: Prove fourteen selected SKU URLs through production reader
        env:
          MEDIAMARKT_READER_AUDIT_OUTPUT_DIR: ${{ runner.temp }}
        run: python audit_mediamarkt_reader.py
      - name: Publish read-only summary
        if: always()
        run: |
          if test -f "${{ runner.temp }}/mediamarkt-reader.md"; then
            cat "${{ runner.temp }}/mediamarkt-reader.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediamarkt-reader-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mediamarkt-reader.json
            ${{ runner.temp }}/mediamarkt-reader.md
          if-no-files-found: warn
          retention-days: 30

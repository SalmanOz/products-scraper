name: Exact phone queue publication

on:
  workflow_dispatch:
    inputs:
      model:
        description: Exact phone candidate to verify
        required: true
        type: choice
        default: galaxy-s26-fe
        options:
          - galaxy-s26-fe
          - redmi-note-17-5g
      publish:
        description: Publish the selected model after live validation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: teknoskor-daily-data-sync
  queue: max
  cancel-in-progress: false

jobs:
  verify-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Start bounded browser GET service
        run: |
          docker run -d --name=s26-queue-browser -p 8191:8191 -e LOG_LEVEL=info ghcr.io/flaresolverr/flaresolverr:latest
          for attempt in {1..25}; do
            if curl --fail --silent http://localhost:8191/ > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Reverify the selected phone, photograph and two sellers
        env:
          PUBLISH: ${{ inputs.publish }}
          MODEL: ${{ inputs.model }}
          TEKNOSKOR_INGESTION_URL: ${{ vars.TEKNOSKOR_INGESTION_URL || 'https://teknoskor.com' }}
          SCRAPER_INGESTION_SECRET: ${{ secrets.SCRAPER_INGESTION_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
        run: |
          args=()
          if [[ "$PUBLISH" == "true" ]]; then args+=(--publish); fi
          case "$MODEL" in
            galaxy-s26-fe) python publish_s26_fe_queue.py "${args[@]}" ;;
            redmi-note-17-5g) python publish_redmi_note_17_queue.py "${args[@]}" ;;
            *) exit 2 ;;
          esac

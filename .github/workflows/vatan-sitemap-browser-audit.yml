name: Vatan Sitemap Browser Discovery Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test sitemap and exact offer safety
        run: python -m unittest -q test_vatan_sitemap_source test_vatan_source_audit test_retailer_offer_refresh
      - name: Start read-only browser GET service
        run: |
          docker run -d --name=vatan-sitemap-browser -p 8191:8191 -e LOG_LEVEL=info ghcr.io/flaresolverr/flaresolverr:latest
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8191/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs vatan-sitemap-browser
          exit 1
      - name: Discover exact URL hints without price reads or writes
        env:
          VATAN_SITEMAP_AUDIT_OUTPUT_DIR: ${{ runner.temp }}
        run: python audit_vatan_sitemap_browser.py
      - name: Measure exact PDP conversion without writes
        continue-on-error: true
        env:
          VATAN_AUDIT_OUTPUT_DIR: ${{ runner.temp }}
        run: python audit_vatan_source.py
      - name: Publish read-only summary
        if: always()
        run: |
          if test -f "${{ runner.temp }}/vatan-sitemap-browser.md"; then
            cat "${{ runner.temp }}/vatan-sitemap-browser.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f "${{ runner.temp }}/vatan-source-audit.md"; then
            cat "${{ runner.temp }}/vatan-source-audit.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vatan-sitemap-browser-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/vatan-sitemap-browser.json
            ${{ runner.temp }}/vatan-sitemap-browser.md
            ${{ runner.temp }}/vatan-source-audit.json
            ${{ runner.temp }}/vatan-source-audit.md
          if-no-files-found: warn
          retention-days: 30

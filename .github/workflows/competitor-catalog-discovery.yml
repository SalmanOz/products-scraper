name: Competitor catalog discovery

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Save the private discovery report without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: site-catalog-price-refresh
  queue: max
  cancel-in-progress: false

jobs:
  discover:
    if: github.repository == 'SalmanOz/products-scraper' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: site-catalog
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      COLLECTOR_AUDIENCE: https://teknoskor.com/api/ingestion/catalog-source-document
      CATALOG_SOURCE_ACTIONS_OIDC: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/site-catalog
        with:
          key: ${{ secrets.SITE_CATALOG_READ_KEY }}
          expansion: |
            /frontend/package.json
            /frontend/package-lock.json
            /frontend/scripts/verify-laptop-pilot.mjs
            /frontend/scripts/verify-accessory-details.mjs
            /frontend/public/media/monitors/
            /frontend/public/media/laptops/
            /frontend/public/media/earbuds/
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        continue-on-error: true
        with:
          ref: codex/competitor-source-snapshots
          path: .competitor-source-snapshots
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify the production collector accepts this workflow
        run: |
          set -euo pipefail
          token=$(bash .github/scripts/collector-token "$COLLECTOR_AUDIENCE")
          code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            --data '{}' "$COLLECTOR_AUDIENCE?scope=competitor")
          test "$code" = 403
      - run: |
          python -m pip install -r requirements.txt
          python -m unittest -q test_competitor_catalog_gaps test_retailer_catalog_feeds test_comparison_phone_offers test_hepsiburada_catalog_source test_serinal_phone_source test_besken_phone_source test_metto_phone_source test_pttavm_offer_source test_n11_catalog_source test_trendyol_catalog_discovery test_trendyol_catalog_source test_comparison_accessory_candidates test_tws_lead_audit test_tws_stage_updates test_tws_refresh test_laptop_price_stage test_comparison_component_candidates test_pc_parts_multistore test_pazarama_offer_source
      - name: Restore the last private discovery state
        env:
          SITE_CATALOG_DEPLOY_KEY: ${{ secrets.SITE_CATALOG_READ_KEY }}
        run: |
          set -euo pipefail
          if bash .github/scripts/site-git ls-remote --exit-code origin refs/heads/scraper-discovery > /dev/null; then
            bash .github/scripts/site-git fetch --depth=1 origin refs/heads/scraper-discovery
            mkdir -p .competitor-discovery
            bash .github/scripts/site-git show FETCH_HEAD:state.json.gz | gzip -dc > .competitor-discovery/state.json
          else
            status=$?
            test "$status" -eq 2
          fi
      - name: Continue catalog and retailer link discovery
        run: |
          set -euo pipefail
          exec > "$RUNNER_TEMP/discovery-collection.log" 2>&1
          curl --fail --silent --show-error --max-time 25 https://teknoskor.com/sitemap.xml -o "$RUNNER_TEMP/site-sitemap.xml"
          python competitor_catalog_gaps.py \
            --site-data site/frontend/src/data \
            --phone-sitemap "$RUNNER_TEMP/site-sitemap.xml" \
            --pages 3 --lead-limit 36 --site-lead-fallback --akakce-budget 26 --cimri-sitemap-only 4 --epey-sitemap-only 4 \
            --import-akakce-snapshot .competitor-source-snapshots/akakce-discovery.json.gz \
            --import-epey-snapshot .competitor-source-snapshots/epey-discovery.json.gz \
            --import-cimri-snapshot .competitor-source-snapshots/cimri-discovery.json.gz \
            --import-ucuzyum-snapshot .competitor-source-snapshots/ucuzyum-discovery.json.gz \
            --import-onual-snapshot .competitor-source-snapshots/onual-discovery.json.gz \
            --state .competitor-discovery/state.json \
            --output .competitor-discovery/report.json
      - name: Verify retailer offers and stage eligible product updates
        run: |
          set -euo pipefail
          exec 3>&1 > "$RUNNER_TEMP/discovery-verification.log" 2>&1
          python comparison_phone_offers.py \
            --state .competitor-discovery/state.json \
            --audit-limit 12 --audit-queue .competitor-discovery/phone-offers.json
          python tws_lead_audit.py \
            --native-search \
            --state .competitor-discovery/state.json \
            --snapshot site/frontend/src/data/twsOfferSnapshot.json \
            --output .competitor-discovery/earbud-offers.json
          python tws_stage_updates.py site/frontend/src/data/twsProductCatalog.json \
            site/frontend/src/data/twsOfferSnapshot.json .competitor-discovery/earbud-offers.json \
            .competitor-discovery/staged-earbud-snapshot.json > .competitor-discovery/staged-earbud-report.json
          python tws_catalog_expansion.py site/frontend/src/data/twsProductCatalog.json \
            site/frontend/src/data/twsOfferSnapshot.json tws_expansion_specs.json \
            .competitor-discovery/earbud-offers.json .competitor-discovery/earbud-expansion --from-audit \
            | tee .competitor-discovery/earbud-expansion-report.json
      - name: Check new phones against the site publication gate
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
          TEKNOSKOR_INGESTION_URL: https://teknoskor.com
          SCRAPER_INGESTION_SECRET: ${{ inputs.dry_run != true && secrets.SCRAPER_INGESTION_SECRET || '' }}
          R2_ACCESS_KEY_ID: ${{ inputs.dry_run != true && secrets.R2_ACCESS_KEY_ID || '' }}
          R2_SECRET_ACCESS_KEY: ${{ inputs.dry_run != true && secrets.R2_SECRET_ACCESS_KEY || '' }}
          R2_ACCOUNT_ID: ${{ inputs.dry_run != true && secrets.R2_ACCOUNT_ID || '' }}
          R2_BUCKET_NAME: ${{ inputs.dry_run != true && secrets.R2_BUCKET_NAME || '' }}
          R2_PUBLIC_DOMAIN: ${{ inputs.dry_run != true && secrets.R2_PUBLIC_DOMAIN || '' }}
        run: |
          set -euo pipefail
          exec 3>&1 > "$RUNNER_TEMP/discovery-phones.log" 2>&1
          args=()
          if [[ "$DRY_RUN" != true ]]; then args+=(--publish); fi
          if ! timeout 300s python unlisted_phone_audit.py "${args[@]}" \
            --state .competitor-discovery/state.json --output .competitor-discovery/unlisted-phone-offers.json; then
            echo '::warning::The unlisted phone audit did not finish this run.' >&3
          fi
      - name: Verify new monitors, laptops and PC components
        run: |
          set -euo pipefail
          exec > "$RUNNER_TEMP/discovery-expansion.log" 2>&1
          python comparison_component_candidates.py --state .competitor-discovery/state.json \
            --catalog site/frontend/src/data/pcParts.json --specs pc_component_specs.json \
            --maximum-per-kind 5 --feed-budget 100 --output .competitor-discovery/components
          python comparison_accessory_candidates.py --native-search 8 --state .competitor-discovery/state.json \
            --site-data site/frontend/src/data --output .competitor-discovery/accessories
      - name: Set up Node.js for the site validators
        if: inputs.dry_run != true
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install the site catalog validator dependencies
        if: inputs.dry_run != true &&
          (hashFiles('.competitor-discovery/accessories/*/*.webp', '.competitor-discovery/earbud-expansion/earbuds/*.webp', '.competitor-discovery/components/photos/*.webp') != '')
        working-directory: site/frontend
        run: npm ci --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/catalog-validator-install.log" 2>&1
      - name: Publish new verified products
        id: publish
        if: inputs.dry_run != true
        env:
          SITE_CATALOG_DEPLOY_KEY: ${{ secrets.SITE_CATALOG_WRITE_KEY }}
        run: bash .github/scripts/publish-discovered-products
      - name: Save the latest reports to a private branch
        if: always() && !cancelled() && hashFiles('.competitor-discovery/report.json') != ''
        env:
          SITE_CATALOG_DEPLOY_KEY: ${{ secrets.SITE_CATALOG_WRITE_KEY }}
        run: bash .github/scripts/save-discovery-report
      - name: Summarize the discovery run
        if: always() && !cancelled()
        run: |
          if [ -s .competitor-discovery/report.json ]; then
            jq '{candidateRows: (.candidates | length), existingRowsWithRetailerLinks: (.existingWithRetailerLeads | length)}' \
              .competitor-discovery/report.json | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify the published catalog on production
        if: steps.publish.outputs.sha != ''
        env:
          EXPECTED_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          bash .github/scripts/wait-for-site "$EXPECTED_SHA" discovery
          python .github/scripts/verify-discovery-live.py .competitor-discovery/publication.json

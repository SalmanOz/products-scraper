name: Hepsiburada Apple Three SKU Scoped Price Refresh

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Write only after this run verifies all three exact PDPs'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# A publishing run shares the existing price-writer queue with the daily job.
concurrency:
  group: ${{ inputs.publish && 'teknoskor-daily-data-sync' || 'teknoskor-hepsiburada-apple-preflight' }}
  queue: max
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test selected buy box and exact catalog routing
        run: python -m unittest -q test_hepsiburada_apple_audit test_reviewed_offer_targets test_retailer_offer_refresh test_price_refresh_orchestration
      - name: Start bounded browser GET service
        run: |
          docker run -d --name=hepsiburada-apple-scoped-browser -p 8191:8191 -e LOG_LEVEL=info ghcr.io/flaresolverr/flaresolverr:latest
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8191/ > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs hepsiburada-apple-scoped-browser
          exit 1
      - name: Reverify all three exact first-party cash offers without writes
        env:
          HEPSIBURADA_APPLE_AUDIT_OUTPUT_DIR: ${{ runner.temp }}
        run: python audit_hepsiburada_apple.py
      - name: Refresh only the three reviewed Apple catalog SKUs
        if: ${{ inputs.publish }}
        id: scoped_prices
        env:
          TEKNOSKOR_INGESTION_URL: ${{ vars.TEKNOSKOR_INGESTION_URL || 'https://teknoskor.com' }}
          SCRAPER_INGESTION_SECRET: ${{ secrets.SCRAPER_INGESTION_SECRET }}
        run: |
          set -euo pipefail
          : "${SCRAPER_INGESTION_SECRET:?SCRAPER_INGESTION_SECRET is required}"
          python update_prices.py \
            --slugs apple-iphone-17e,apple-iphone-18-pro,apple-iphone-18-pro-max \
            --known-pdp-only --report hepsiburada-apple-scoped-report.json
      - name: Reconcile scores after committed offers
        if: ${{ always() && !cancelled() && (steps.scoped_prices.outcome == 'success' || steps.scoped_prices.outcome == 'failure') }}
        env:
          TEKNOSKOR_INGESTION_URL: ${{ vars.TEKNOSKOR_INGESTION_URL || 'https://teknoskor.com' }}
          SCRAPER_INGESTION_SECRET: ${{ secrets.SCRAPER_INGESTION_SECRET }}
        run: python reconcile_scores.py
      - name: Summarize audit and scoped refresh
        if: always()
        run: |
          if test -f "${{ runner.temp }}/hepsiburada-apple-audit.md"; then
            cat "${{ runner.temp }}/hepsiburada-apple-audit.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f hepsiburada-apple-scoped-report.json; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('hepsiburada-apple-scoped-report.json').read_text())
          coverage = report.get('coverage', {})
          lines = ['## Three reviewed Apple SKU refresh',
                   f"Status: {report.get('status')}; verified offer on {coverage.get('with_purchasable_offer', 0)}/{coverage.get('products', 0)} models; two merchants on {coverage.get('with_two_merchants', 0)}."]
          for product in report.get('products', []):
              rows = [row for row in product.get('source_attempts', []) if row.get('merchant') == 'Hepsiburada']
              lines.append(f"- {product['slug']}: " + ', '.join(f"{row.get('reason')} HTTP {row.get('http_status')}" for row in rows))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('\n'.join(lines) + '\n')
          PY
          fi
      - name: Upload audit and price evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hepsiburada-apple-scoped-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hepsiburada-apple-audit.json
            ${{ runner.temp }}/hepsiburada-apple-audit.md
            hepsiburada-apple-scoped-report.json
            score-reconciliation.json
          if-no-files-found: warn
          retention-days: 30

name: MediaMarkt S24 FE Exact GTIN Scoped Refresh

on:
  schedule:
    - cron: '45 4 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Write only after this run verifies the exact GTIN and new selected seller'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.publish) && 'teknoskor-daily-data-sync' || 'teknoskor-mediamarkt-s24fe-gtin-preflight' }}
  queue: max
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test exact GTIN proof and one-SKU writer gate
        run: python -m unittest -q test_mediamarkt_s24fe_gtin test_mediamarkt_marketplace_audit test_mediamarkt_marketplace_pipeline test_mediamarkt_source test_retailer_offer_refresh test_price_refresh_orchestration
      - name: Start bounded MediaMarkt browser GET service
        run: |
          docker run -d --name=mediamarkt-s24fe-browser -p 8191:8191 -e LOG_LEVEL=info ghcr.io/flaresolverr/flaresolverr:latest
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8191/ > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs mediamarkt-s24fe-browser
          exit 1
      - name: Reverify exact GTIN, catalog identity and selected seller without writes
        env:
          TEKNOSKOR_INGESTION_URL: ${{ vars.TEKNOSKOR_INGESTION_URL || 'https://teknoskor.com' }}
          SCRAPER_INGESTION_SECRET: ${{ secrets.SCRAPER_INGESTION_SECRET }}
          MEDIAMARKT_S24FE_AUDIT_OUTPUT_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          : "${SCRAPER_INGESTION_SECRET:?SCRAPER_INGESTION_SECRET is required}"
          python audit_mediamarkt_s24fe_gtin.py
      - name: Publish only the freshly audited exact-GTIN seller offer
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        id: scoped_prices
        env:
          TEKNOSKOR_INGESTION_URL: ${{ vars.TEKNOSKOR_INGESTION_URL || 'https://teknoskor.com' }}
          SCRAPER_INGESTION_SECRET: ${{ secrets.SCRAPER_INGESTION_SECRET }}
          MEDIAMARKT_S24FE_VERIFIED_AUDIT_FILE: ${{ runner.temp }}/mediamarkt-s24fe-gtin.json
        run: |
          set -euo pipefail
          : "${SCRAPER_INGESTION_SECRET:?SCRAPER_INGESTION_SECRET is required}"
          python update_prices.py --slugs samsung-galaxy-s24fe \
            --known-pdp-only --report mediamarkt-s24fe-gtin-report.json
      - name: Require the exact one seller offer accepted
        if: ${{ (github.event_name == 'schedule' || inputs.publish) && steps.scoped_prices.outcome == 'success' }}
        id: verify
        run: |
          python verify_mediamarkt_s24fe_gtin.py \
            "${{ runner.temp }}/mediamarkt-s24fe-gtin.json" \
            mediamarkt-s24fe-gtin-report.json
      - name: Reconcile scores after acceptance
        if: ${{ (github.event_name == 'schedule' || inputs.publish) && steps.verify.outcome == 'success' }}
        env:
          TEKNOSKOR_INGESTION_URL: ${{ vars.TEKNOSKOR_INGESTION_URL || 'https://teknoskor.com' }}
          SCRAPER_INGESTION_SECRET: ${{ secrets.SCRAPER_INGESTION_SECRET }}
        run: python reconcile_scores.py
      - name: Summarize audit and scoped refresh
        if: always()
        run: |
          if test -f "${{ runner.temp }}/mediamarkt-s24fe-gtin.md"; then
            cat "${{ runner.temp }}/mediamarkt-s24fe-gtin.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f mediamarkt-s24fe-gtin-report.json; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('mediamarkt-s24fe-gtin-report.json').read_text())
          ingestion = report.get('ingestion') or {}
          lines = ['## S24 FE exact GTIN pazar yeri yazımı',
                   f"Durum: {report.get('status')}; kabul {ingestion.get('accepted')}/1; "
                   f"ret {ingestion.get('variant_rejected')}; eski {ingestion.get('stale_ignored')}."]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('\n'.join(lines) + '\n')
          PY
          fi
      - name: Upload audit and scoped write evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediamarkt-s24fe-gtin-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mediamarkt-s24fe-gtin.json
            ${{ runner.temp }}/mediamarkt-s24fe-gtin.md
            mediamarkt-s24fe-gtin-report.json
            score-reconciliation.json
          if-no-files-found: warn
          retention-days: 30

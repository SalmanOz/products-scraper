name: Daily Price & Data Sync

on:
  schedule:
    # Runs every day at 03:00 UTC (06:00 AM Turkish Time)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      run_technical_data:
        description: 'Run the technical source ingestion manually'
        required: false
        type: boolean
        default: false
      run_phase2_backfill:
        description: 'Run the one-time Phase 2 offer backfill'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: teknoskor-daily-data-sync
  cancel-in-progress: false

jobs:
  sync-data:
    name: Sync Specifications & Prices
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate manual mode
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RUN_TECHNICAL_DATA: ${{ github.event.inputs.run_technical_data }}
          RUN_PHASE2_BACKFILL: ${{ github.event.inputs.run_phase2_backfill }}
        run: |
          if [[ "${RUN_TECHNICAL_DATA}" == "true" && "${RUN_PHASE2_BACKFILL}" == "true" ]]; then
            echo "Choose either technical ingestion or Phase 2 backfill, not both." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start FlareSolverr
        run: |
          docker run -d \
            --name=flaresolverr \
            -p 8191:8191 \
            -e LOG_LEVEL=info \
            --restart always \
            ghcr.io/flaresolverr/flaresolverr:latest
          
          echo "Waiting for FlareSolverr to start..."
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8191/ > /dev/null; then
              echo "FlareSolverr is up and running!"
              exit 0
            fi
            sleep 2
          done
          docker logs flaresolverr
          echo "FlareSolverr did not become ready within 60 seconds" >&2
          exit 1

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper regression tests
        run: |
          python test_matching.py
          python test_price_scraper_sources.py
          python test_offer_ingestion_client.py
          python test_price_update_resilience.py
          python test_source_ingestion.py

      - name: Run Technical Data Scraper (Kimovil)
        # Manual-only until the existing-product source backfill is reviewed.
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_technical_data == 'true' }}
        env:
          TEKNOSKOR_INGESTION_URL: ${{ vars.TEKNOSKOR_INGESTION_URL || 'https://teknoskor.com' }}
          SCRAPER_INGESTION_SECRET: ${{ secrets.SCRAPER_INGESTION_SECRET }}
        run: |
          set -euo pipefail
          : "${TEKNOSKOR_INGESTION_URL:?TEKNOSKOR_INGESTION_URL is required}"
          : "${SCRAPER_INGESTION_SECRET:?SCRAPER_INGESTION_SECRET is required}"
          python main.py

      - name: Run Price Update Scraper (TR Merchants)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_technical_data != 'true') }}
        env:
          TEKNOSKOR_INGESTION_URL: ${{ vars.TEKNOSKOR_INGESTION_URL || 'https://teknoskor.com' }}
          SCRAPER_INGESTION_SECRET: ${{ secrets.SCRAPER_INGESTION_SECRET }}
          RUN_PHASE2_BACKFILL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_technical_data != 'true' && github.event.inputs.run_phase2_backfill == 'true' }}
        run: |
          set -euo pipefail
          : "${TEKNOSKOR_INGESTION_URL:?TEKNOSKOR_INGESTION_URL is required}"
          : "${SCRAPER_INGESTION_SECRET:?SCRAPER_INGESTION_SECRET is required}"
          if [[ "${RUN_PHASE2_BACKFILL}" == "true" ]]; then
            python update_prices.py --phase2-backfill
          else
            python update_prices.py
          fi

      - name: Dump FlareSolverr Logs (Diagnostics)
        if: always()
        run: |
          docker logs flaresolverr

name: Laptop price refresh

on:
  schedule:
    - cron: '7 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Collect and verify prices without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: site-catalog-price-refresh
  queue: max
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'SalmanOz/products-scraper' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: site-catalog
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      CATALOG_SOURCE_ACTIONS_OIDC: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/site-catalog
        with:
          key: ${{ secrets.SITE_CATALOG_READ_KEY }}
          expansion: |
            /frontend/scripts/verify-laptop-pilot.mjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies and test the laptop refresh
        run: |
          python -m pip install -r requirements.txt
          python -m unittest -q test_laptop_pilot test_laptop_price_stage
      - name: Verify the production retailer collector
        run: |
          set -euo pipefail
          audience=https://teknoskor.com/api/ingestion/catalog-source-document
          token=$(bash .github/scripts/collector-token "$audience")
          code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            --data '{"url":"https://www.n11.com/sepet"}' "$audience?scope=accessory-discovery")
          test "$code" = 403
      - name: Refresh verified offers for existing configurations
        id: collect
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/site-price-refresh"
          mkdir -p "$out"
          source=site/frontend/src/data/laptopPilot.json
          sha256sum "$source" | cut -d ' ' -f 1 > "$out/source.sha256"
          python laptop_price_stage.py "$source" "$out" --refresh
          count=$(jq '.staged | length' "$out/staged-laptop-report.json")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [[ "$count" != 0 ]]; then
            node site/frontend/scripts/verify-laptop-pilot.mjs --offers-only "$out/staged-laptop-catalog.json" \
              > "$out/validation.log" 2>&1 || { echo 'Laptop snapshot did not pass validation.' >&2; exit 1; }
          fi
      - name: Publish the verified price snapshot
        id: publish
        if: inputs.dry_run != true && steps.collect.outputs.count != '0'
        env:
          SITE_CATALOG_DEPLOY_KEY: ${{ secrets.SITE_CATALOG_WRITE_KEY }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/site-price-refresh"
          bash .github/scripts/publish-site-prices laptop "$out/staged-laptop-catalog.json" "$(cat "$out/source.sha256")"
      - name: Verify the website is serving the published commit
        if: steps.publish.outputs.sha != ''
        env:
          EXPECTED_SHA: ${{ steps.publish.outputs.sha }}
        run: bash .github/scripts/wait-for-site "$EXPECTED_SHA" laptop

[workspace]
resolver = "2"
members = [
    "crates/psr-core",
    "crates/psr-ingestion",
    "crates/psr-fetch",
    "crates/psr-parse",
    "crates/psr-refresh",
    "crates/psr-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "2"
chrono = "0.4"
scraper = "0.23"
wiremock = "0.6"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
codegen-units = 1
